# Render's free plan sleeps after 15 minutes without traffic, and the first visit then takes
# up to a minute. This pings the demo every 10 minutes while it is open for judging.
name: Keep the demo awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 https://liveproof-j5u7.onrender.com/api/health || true
